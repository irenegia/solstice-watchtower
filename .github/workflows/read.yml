# Runs the reader every 10 minutes and commits the record. It only reads from the public calibnet endpoint;
# it holds no key and no secret. Rules for when it fails are in DESIGN.md ("The scheduled job").
name: read
on:
  schedule:
    # Every 10 minutes, but off the round minutes (:00, :10, ...): GitHub's scheduler is "best effort", delays or
    # drops runs when it is busy, and is busiest at the top of the hour. The reader catches up from its last epoch.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: # also startable by hand from the Actions tab

permissions:
  contents: write # to commit the record

concurrency:
  group: read # never two readers at once: they would write the same epochs twice
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # two networks; butterfly took about 5 minutes per 720 epochs on 2026-09-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SLACK_WEBHOOK (a repository secret, optional): the reader posts one Slack message per run that found something
      # new. Without the secret nothing is sent. Butterflynet opts out in its config.
      - run: node bin/reader.js config/calibnet.json
        env: { SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} }
      # Mainnet: the contracts are deployed (2026-09-22); the upgrade date is not confirmed. Reads only the endpoint.
      - run: node bin/reader.js config/mainnet.json
        env: { SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} }
        continue-on-error: true
      # Butterflynet gamma, the nv29 test network (lotus-infra issue #1654). A failure here must not stop the
      # calibnet record from being committed, so this step may fail without failing the job.
      - run: node bin/reader.js config/butterfly-gamma.json
        continue-on-error: true
      - name: Commit the record if it changed
        run: |
          git config user.name "watchtower reader"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/calibnet site/data/mainnet site/data/butterfly-gamma
          git diff --cached --quiet || git commit -m "record: $(jq -r .lastEpoch site/data/calibnet/status.json)"
          git push

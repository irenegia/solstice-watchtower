<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solstice watchtower</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --card:#fff; --bad:#b3261e; --ok:#1a7f37; --warn-bg:#fff4d6; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecece8; --muted:#a0a09a; --line:#3a3a36; --card:#1f1f1d; --bad:#ff8a80; --ok:#7bd88f; --warn-bg:#4a3c10; --accent:#8ab4f8; } }
  body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:17px; margin:32px 0 8px; }
  a { color:var(--accent); } .muted { color:var(--muted); } .bad { color:var(--bad); font-weight:600; } .ok { color:var(--ok); }
.banner.stopped { background:var(--bad); color:var(--bg); }
  .banner { background:var(--warn-bg); padding:8px 12px; border-radius:6px; margin:12px 0; font-weight:600; }
  .scroll { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; vertical-align:top; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; white-space:nowrap; } tr:last-child td { border-bottom:0; }
  td.nowrap { white-space:nowrap; } td.result { min-width:170px; max-width:260px; overflow-wrap:anywhere; } code, pre { font:12.5px ui-monospace, Menlo, monospace; }
  pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-all; color:var(--muted); }
  details.quarter { margin:10px 0; } details.quarter > summary { cursor:pointer; font-weight:600; padding:6px 0; }
  details.row > summary { cursor:pointer; list-style:none; } details.row > summary::-webkit-details-marker { display:none; }
  .filters { display:flex; gap:16px; flex-wrap:wrap; margin:8px 0; font-size:14px; }
  /* The network bar: one colour per network, so a visitor sees at once which chain the page shows. */
  body { border-top:10px solid var(--net); } :root { --net:#0b57d0; } body[data-net='butterfly'] { --net:#e0731c; }
  .net { display:inline-block; padding:2px 10px; border-radius:6px; background:var(--net); color:#fff; font-weight:700; }
  .views { margin:6px 0 0; } .views a.here { font-weight:700; text-decoration:none; color:var(--fg); }
  footer { margin-top:48px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Solstice watchtower <span id="net" class="net"></span></h1>
  <div id="views" class="views muted"></div>
  <div id="head" class="muted">loading…</div>
  <div id="banner"></div>

  <h2>1. Queued writes</h2>
  <div class="muted">Writes waiting in the f02 pending-write queue. Time left runs in your browser.</div>
  <div id="live"></div>
  <div class="muted">Recorded by the reader:</div>
  <div id="queue"></div>

  <h2>2. What landed</h2>
  <div class="filters">
    <label>Source <select id="fSource"><option value="">all</option><option>f02</option><option>SRA</option><option>SWA</option></select></label>
    <label><input type="checkbox" id="fBad"> only reverted messages</label>
  </div>
  <div id="landed"></div>

  <h2>3. State</h2>
  <div class="muted">Values that leave no event. Each line shows the last value read and when it last changed.</div>
  <div id="state"></div>
  <footer id="foot" class="muted"></footer>
</main>

<script type="importmap">{ "imports": { "@ipld/dag-cbor": "https://cdn.jsdelivr.net/npm/@ipld/dag-cbor@9.2.0/+esm" } }</script>
<script type="module">
// The page displays the record written by bin/reader.js, and reads f02 live from the chain for parts 1 and 3.
// The f02 decoder is the same file the reader uses.
import { decodeStreamsState, computeWeight as weightNow, fromBase64 } from './lib/f02.js'

// The repo the scheduled job commits the record to. The page asks it first, so the record is fresh even when
// this page was published long ago; the copy bundled next to the page is the fallback.
const REPO_RAW = 'https://raw.githubusercontent.com/irenegia/solstice-watchtower/main/site/'
const STALE_MINUTES = 30
// Views of a network the scheduled job still watches: they get the repo fetch, the "reader stopped" warning and the
// live read of f02. The other views are fixed records.
const LIVE = ['calibnet', 'butterfly-gamma']
// The views, each with the note shown on top. calibnet is the real watchtower record and needs no note.
// The sample and real-test views were removed 2026-09-22 (their records stay in the repo history).
const VIEWS = { calibnet: 'calibnet', 'butterfly-gamma': 'butterfly gamma', 'butterfly-alpha': 'butterfly alpha' }
const NOTES = {
  calibnet: '',
  'butterfly-gamma': 'A live test network, not calibnet. Butterflynet "gamma" started 2026-09-19 09:00 UTC; FIP-0118 activates on it at epoch 5220 ' +
    '(Mon 2026-09-21 04:30 UTC), with 2-hour quarters and a 20-minute SWA_TIMELOCK. rvagg runs the nv29 test plan on it. Quarter numbers here follow the FIP: ' +
    'quarter 1 starts at the activation epoch. The contracts and rvagg\'s plan count the same quarters from 0, so his "Q0" is quarter 1 here. ' +
    'The message links do not work: butterflynet has no block explorer.',
  'butterfly-alpha': 'REAL Solstice data from a test network that no longer exists. Butterflynet "alpha" ran from 2026-09-17 20:04 UTC until its ' +
    'reset on 2026-09-18, with FIP-0118 active from epoch 90, 2-hour quarters and a 20-minute SWA_TIMELOCK. rvagg ran a test script on it: almost every ' +
    'SRA, SWA and f02 action. Read once on 2026-09-18, before the reset. This node had the actor events API off, so the record has NO f02 events ' +
    '(write-queued, claim-payout); the f02 state and the messages sent to f02 are there. Quarter boundaries are off by one epoch (see config/butterfly-alpha.json). ' +
    'The message links do not work: butterflynet has no block explorer.',
}
const requested = new URLSearchParams(location.search).get('data')
const dataset = requested in NOTES ? requested : 'calibnet'
const dir = `data/${dataset}/`
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const utc = (iso) => iso.replace('T', ' ').slice(0, 16) + ' UTC'

// Display units. The raw integer is always in the expanded row.
const E18 = 10n ** 18n
const scaled = (v, div, digits) => { const n = BigInt(v); const s = (n < 0n ? -n : n) * 10n ** BigInt(digits) / div; const t = s.toString().padStart(digits + 1, '0'); return (n < 0n ? '-' : '') + t.slice(0, -digits) + '.' + t.slice(-digits) }
function show(key, v) {
  if (v === null || v === undefined) return '–'
  if (typeof v === 'object') return Object.entries(v).map(([k, x]) => `${k}: ${show(k, x)}`).join(', ')
  if (/^-?\d+$/.test(v)) {
    if (/attoFil$/i.test(key) || ['difference', 'balanceBefore', 'balanceAfter'].includes(key)) return scaled(v, E18, 4) + ' FIL'
    if (['volume', 'usd', 'totalUsd', 'fpv', 'value', 'base'].includes(key)) return scaled(v, E18, 2) + ' USD'
    if (['vStart', 'floor', 'cap', 'share'].includes(key)) return scaled(v, 10n ** 16n, 2) + '%'
  }
  return String(v)
}
const summary = (fields) => Object.entries(fields ?? {}).map(([k, v]) => `${esc(k)}: ${esc(show(k, v))}`).join(' · ')

function timeLeft(epochs, epochSeconds) {
  if (epochs <= 0) return '<span class="muted">effective epoch passed</span>'
  const min = Math.round(epochs * epochSeconds / 60)
  return min >= 1440 ? `${Math.floor(min / 1440)} d ${Math.floor(min % 1440 / 60)} h` : `${Math.floor(min / 60)} h ${min % 60} min`
}

const slot = (w) => `${w.op}|${w.streamId ?? ''}|${w.effectiveEpoch}`

async function main() {
  // Record: the repo first (not when developing on localhost, and only for the real record), else the bundled copy.
  const load = (base) => Promise.all([fetch(base + dir + 'status.json').then((r) => r.ok ? r.json() : Promise.reject(r.status)), fetch(base + dir + 'records.jsonl').then((r) => r.ok ? r.text() : Promise.reject(r.status))])
  const useRepo = LIVE.includes(dataset) && !['localhost', '127.0.0.1'].includes(location.hostname)
  let from = 'the copy published with this page'
  const [status, text] = await (useRepo ? load(REPO_RAW).then((x) => (from = 'the repo', x)).catch(() => load('')) : load(''))
  const records = text.split('\n').filter(Boolean).map((l) => JSON.parse(l)).sort((a, b) => a.epoch - b.epoch)
  records0 = records
  const nowEpoch = () => Math.floor((Date.now() / 1000 - status.genesisTimestamp) / status.epochSeconds)
  const quarterStart = (q) => status.activationEpoch + (q - 1) * status.epochsPerQuarter
  const epochTime = (e) => new Date((status.genesisTimestamp + e * status.epochSeconds) * 1000).toISOString()
  const quarterNow = status.activationEpoch && nowEpoch() >= status.activationEpoch ? Math.floor((nowEpoch() - status.activationEpoch) / status.epochsPerQuarter) + 1 : 0

  $('net').textContent = status.network
  document.body.dataset.net = status.network.startsWith('butterfly') ? 'butterfly' : 'calibnet'
  $('views').innerHTML = 'You are looking at <b>' + esc(status.network) + '</b>. Other networks: ' +
    Object.entries(VIEWS).map(([k, v]) => k === dataset ? `<a class="here">${v}</a>` : `<a href="${k === 'calibnet' ? '?' : `?data=${k}`}">${v}</a>`).join(' | ')
  $('head').innerHTML = `last epoch read ${status.lastEpoch} (${utc(epochTime(status.lastEpoch))}) · ` +
    (quarterNow ? `quarter ${quarterNow} now` : 'before activation') + ` · <a href="${dir}records.jsonl">record file</a>`
  if (NOTES[dataset]) $('banner').innerHTML = `<div class="banner">${esc(NOTES[dataset])}</div>`
  $('head').innerHTML += ` · record from ${from}`
  // Rule: a reader that stopped must be visible. The live read below does not depend on the reader.
  const ageMin = Math.round((Date.now() - new Date(status.lastRun)) / 60000)
  if (LIVE.includes(dataset) && ageMin > STALE_MINUTES) $('banner').innerHTML += `<div class="banner stopped">The reader has not run since ${utc(status.lastRun)} (${ageMin} minutes ago). The history below may be incomplete.</div>`
  liveRead(status, nowEpoch, epochTime).catch((err) => { $('live').innerHTML = `<div class="banner stopped">Live read of f02 failed: ${esc(err.message)}. Parts 1 and 3 show recorded values only.</div>` })

  // 1. queued writes: from the f02 state when the reader has it, and rebuilt from events as a cross-check
  const fromEvents = new Map()
  for (const r of records) {
    if (r.source !== 'f02' || r.kind !== 'event' || !r.name.startsWith('write-')) continue
    const key = `${r.fields.op}|${r.fields.streamId ?? ''}|${r.fields.effectiveEpoch}`
    if (r.name === 'write-queued') fromEvents.set(key, { ...r.fields, queuedAt: r.epoch, msgCid: r.msgCid })
    else fromEvents.delete(key)
  }
  const pendingFromEvents = [...fromEvents.values()].filter((w) => w.effectiveEpoch > status.lastEpoch)
  const streamsRead = records.filter((r) => r.name === 'f02 streams' && !r.fields.error).at(-1)
  const queue = streamsRead ? streamsRead.fields.pendingWrites.map((w) => ({ ...w, ...(fromEvents.get(slot(w)) ?? {}) })) : pendingFromEvents
  let queueHtml = ''
  if (streamsRead) {
    const a = streamsRead.fields.pendingWrites.map(slot).sort().join(), b = pendingFromEvents.map(slot).sort().join()
    if (a !== b) queueHtml += '<div class="banner">The queue read from the f02 state and the queue rebuilt from the events differ. Check both in the record file.</div>'
  }
  queueHtml += queue.length === 0 ? `<p>No queued writes at epoch ${status.lastEpoch}.</p>` :
    `<div class="scroll"><table><tr><th>op</th><th>stream-id</th><th>effective epoch</th><th>time left</th><th>payload</th><th>queued</th></tr>` +
    queue.sort((x, y) => x.effectiveEpoch - y.effectiveEpoch).map((w) => `<tr>
      <td>${esc(w.op)}${w.cancellable === false ? '<br><span class="muted">cannot be cancelled</span>' : ''}</td>
      <td>${w.streamId ?? '<span class="muted">schedule-wide</span>'}</td>
      <td class="nowrap">${w.effectiveEpoch}<br><span class="muted">${utc(epochTime(w.effectiveEpoch))}</span></td>
      <td class="nowrap" data-effective="${w.effectiveEpoch}"></td>
      <td><details class="row"><summary>${summary(w.payload)}</summary><pre>${esc(JSON.stringify(w.payload, null, 2))}</pre></details></td>
      <td class="nowrap">${w.queuedAt ? `epoch ${w.queuedAt}` : '–'}${w.msgCid ? `<br><a href="${msgLink(w.msgCid)}">message</a>` : ''}</td></tr>`).join('') + '</table></div>'
  $('queue').innerHTML = queueHtml
  const tick = () => document.querySelectorAll('[data-effective]').forEach((td) => { td.innerHTML = timeLeft(td.dataset.effective - nowEpoch(), status.epochSeconds) })
  tick(); setInterval(tick, 30000)

  // 2. what landed: events, messages and claim checks, one table per quarter, newest quarter first and newest row first
  function renderLanded() {
    const source = $('fSource').value, onlyBad = $('fBad').checked
    const rows = records.filter((r) => (r.kind !== 'read' || r.name === 'claim check') && (!source || r.source === source || r.kind === 'gap') && (!onlyBad || r.ok === false))
    const quarters = [...new Set(rows.map((r) => r.quarter))].sort((a, b) => b - a)
    $('landed').innerHTML = rows.length === 0 ? '<p>Nothing yet.</p>' : quarters.map((q, i) => {
      const label = q === 0 ? 'Before activation' :
        `Quarter ${q} · ${utc(epochTime(quarterStart(q)))} to ${utc(epochTime(quarterStart(q + 1)))}` + (dataset === 'calibnet' ? ` · rehearsal plan: ${q === 1 ? 'Activation day' : `Q${q - 1} cycle`}` : '')
      const body = rows.filter((r) => r.quarter === q).reverse().map((r) => `<tr>
        <td class="nowrap">${utc(r.time)}<br><span class="muted">epoch ${r.epoch}</span></td>
        <td class="nowrap">${esc(r.source)}<br><span class="muted">${r.kind}</span></td>
        <td><details class="row"><summary><b>${esc(r.name)}</b> ${summary(r.fields)}</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>
          ${r.from ? `<span class="muted">from ${esc(r.from)}${r.via ? ` via ${esc(r.via)}` : ''}</span>` : ''}</td>
        <td class="result">${r.kind === 'message' ? (r.ok ? '<span class="ok">ok</span>' : `<span class="bad">reverted</span><br>${esc(r.error ?? '')}`) : r.name === 'claim check' ? (r.fields.matches ? '<span class="ok">matches</span>' : '<span class="bad">does not match</span>') : r.kind === 'gap' ? '<span class="bad">not read</span>' : ''}</td>
        <td class="nowrap">${r.tx ? `<a href="${msgLink(r.tx)}">message</a>` : r.msgCid ? `<a href="${msgLink(r.msgCid)}">message</a>` : ''}</td></tr>`).join('')
      return `<details class="quarter" ${i === 0 ? 'open' : ''}><summary>${label} <span class="muted">(${rows.filter((r) => r.quarter === q).length})</span></summary>
        <div class="scroll"><table><tr><th>time</th><th>source</th><th>what</th><th>result</th><th>link</th></tr>${body}</table></div></details>`
    }).join('')
  }
  $('fSource').onchange = $('fBad').onchange = renderLanded
  renderLanded()

  // 3. state: the last value of every read
  const last = new Map()
  for (const r of records) if (r.kind === 'read' && r.name !== 'claim check') last.set(r.name, r)
  $('state').innerHTML = `<div class="scroll"><table><tr><th>read</th><th>value</th><th>last changed</th></tr>` + [...last.values()].map((r) => {
    let value = summary(r.fields)
    if (r.name === 'f02 streams' && !r.fields.error) value = r.fields.streams.map((s) =>
      `stream ${s.id}: weight now <b>${scaled(weightNow(s.weight, nowEpoch()), 10n ** 16n, 2)}%</b>` +
      (s.distribution ? ` · share map: ${s.distribution.shares.map((x) => `${esc(x.recipient)} ${scaled(x.share, 10n ** 16n, 2)}%`).join(', ') || 'empty'}` : ' · IMPLICIT')).join('<br>')
    return `<tr><td class="nowrap">${esc(r.name)}</td><td><details class="row"><summary>${value}</summary><pre>${esc(JSON.stringify(r.fields, null, 2))}</pre></details></td>
      <td class="nowrap">${utc(r.time)}<br><span class="muted">epoch ${r.epoch}</span></td></tr>`
  }).join('') + '</table></div>'
}

// Live read: the f02 state as of now, asked from the chain by this browser. Shown above the recorded values.
async function liveRead(status, nowEpoch, epochTime) {
  if (!LIVE.includes(dataset) || !status.rpcUrl) return
  const rpc = async (method, params) => {
    const body = await (await fetch(status.rpcUrl, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) })).json()
    if (body.error) throw new Error(`${method}: ${body.error.message}`)
    return body.result
  }
  const { State } = await rpc('Filecoin.StateReadState', [status.f02, null])
  const root = Object.values(State).find((v) => v && typeof v === 'object' && '/' in v)?.['/']
  const at = `live from the chain, f02 epoch ${State.Epoch} (${utc(epochTime(State.Epoch))})`
  if (!root) {
    $('live').innerHTML = `<p><b>Live:</b> ${at}. f02 on this network has no stream state yet: it still runs the code from before the upgrade, so there is no queue to read.</p>`
    return
  }
  const live = decodeStreamsState(fromBase64(await rpc('Filecoin.ChainReadObj', [{ '/': root }])), status.addressPrefix)
  const recorded = records0.filter((r) => r.name === 'f02 streams' && !r.fields.error).at(-1)
  const differs = recorded && JSON.stringify(recorded.fields.pendingWrites.map(slot).sort()) !== JSON.stringify(live.pendingWrites.map(slot).sort())
  footnote(live, status)
  $('live').innerHTML = `<p><b>Live:</b> ${at}. ${live.pendingWrites.length} queued write(s).` +
    (differs ? ` <span class="bad">This differs from the recorded queue of ${utc(recorded.time)}.</span> The recorded one is older; if the difference stays after the next reader run, check both.` : '') + '</p>' +
    (live.pendingWrites.length ? `<div class="scroll"><table><tr><th>op</th><th>stream-id</th><th>effective epoch</th><th>time left</th><th>payload</th></tr>` +
      live.pendingWrites.map((w) => `<tr><td>${esc(w.op)}${w.cancellable ? '' : '<br><span class="muted">cannot be cancelled</span>'}</td><td>${w.streamId ?? '<span class="muted">schedule-wide</span>'}</td>
        <td class="nowrap">${w.effectiveEpoch}<br><span class="muted">${utc(epochTime(w.effectiveEpoch))}</span></td><td class="nowrap" data-effective="${w.effectiveEpoch}">${timeLeft(w.effectiveEpoch - nowEpoch(), status.epochSeconds)}</td>
        <td><details class="row"><summary>${summary(w.payload)}</summary><pre>${esc(JSON.stringify(w.payload, null, 2))}</pre></details></td></tr>`).join('') + '</table></div>' : '') +
    `<p class="muted">Weights now: ${live.streams.map((st) => `stream ${st.id} ${scaled(weightNow(st.weight, nowEpoch()), 10n ** 16n, 2)}%`).join(' · ')}</p>`
}
let records0 = []

// Footnote: the SRA counts quarters from its activationEpoch (deployments.json); f02's ramp starts at stream 1's t_start,
// set by the migration to the upgrade epoch + 1. FIP-0118 §2.4.10 expects them equal. A one-epoch difference changes
// nothing on this page; more than that is worth a look.
function footnote(live, status) {
  const t = live.streams.find((s) => s.id === 1)?.weight.tStart
  if (t === undefined || !status.activationEpoch) return
  const d = Math.abs(t - status.activationEpoch)
  const rel = d === 0 ? 'equal' : d === 1 ? 'one epoch apart, which changes nothing here' : `<span class="bad">${d} epochs apart, which is unexpected</span>`
  $('foot').innerHTML = `Quarter numbers on this page follow the SRA: Start(Q) = activationEpoch + (Q-1) · EPOCHS_PER_QUARTER, with activationEpoch ${status.activationEpoch} ` +
    `from solstice deployments.json. f02's own ramp starts at t_start of stream 1, set by the migration to the upgrade epoch + 1: here ${t}. ` +
    `The two are ${rel}. FIP-0118 §2.4.10 expects them equal.`
}

// ponytail: one explorer, hard-coded. Filfox accepts both 0x transaction hashes and message CIDs.
const msgLink = (id) => `https://calibration.filfox.info/en/message/${id}`

main().catch((err) => { $('head').textContent = `Could not load ${dir}: ${err.message}` })
</script>
</body>
</html>
